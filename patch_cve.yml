- name: Retrieve hosts from Ledger Pro
  hosts: all
  connection: local
  gather_facts: false
  run_once: true

  vars:
    cve: ""
    ledger_url: ""

  tasks:
    - name: Validate CVE format
      ansible.builtin.assert:
        that:
          - (cve | upper) is match('^CVE-[0-9]{4}-[0-9]{4,7}$')
        fail_msg: >
          Invalid CVE format. Expected CVE-YYYY-NNNN through CVE-YYYY-NNNNNNN.

    - name: Validate Ledger base URL
      ansible.builtin.assert:
        that:
          - ledger_url is match('^https?://(([A-Za-z0-9-]+\.)+[A-Za-z]{2,}|([0-9]{1,3}\.){3}[0-9]{1,3})(:[0-9]{1,5})?$')
        fail_msg: >
          API base URL must be http:// or https:// followed by a domain,
          subdomain, or IPv4 address, optionally with a port, and must not
          end with a slash.

    - name: Connect to Ledger Pro to retrieve CVE data
      ansible.builtin.uri:
        url: "{{ ledger_url }}/api/v1/errata/cve/{{ cve | upper }}/"
        method: GET
        user: "{{ username }}"
        password: "{{ password }}"
        force_basic_auth: true
        status_code: [200, 404]
        use_proxy: false
        validate_certs: false
      register: cve_data

    - name: Stop if CVE data is invalid or empty
      ansible.builtin.meta: end_play
      when:
        - cve_data.status == 404 or
          cve_data.json is undefined or
          cve_data.json.hosts is undefined or
          cve_data.json.hosts | length == 0 or
          cve_data.json.rpms is undefined or
          cve_data.json.rpms | length == 0

    - name: Add Ledger hosts to patch group
      ansible.builtin.add_host:
        name: "{{ item }}"
        groups: cve_patch_hosts
        cve_packages: "{{ cve_data.json.rpms }}"
      loop: "{{ cve_data.json.hosts }}"
      when: item in hostvars


- name: Update vulnerable packages
  hosts: cve_patch_hosts
  become: true

  tasks:
    - name: Gather Package Facts before patching
      ansible.builtin.package_facts:
        manager: auto
      when: ansible_os_family != 'Windows'

    - name: Install Updates
      ansible.builtin.dnf:
        name: "{{ cve_packages | select('in', ansible_facts.packages.keys() | list) | list }}"
        state: latest

    - name: Gather Package Facts after patching
      ansible.builtin.package_facts:
        manager: auto
      when: ansible_os_family != 'Windows'
